<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title"><title id="title">SHAGHAD — three original logo concepts with actual small-size samples</title><rect width="1680" height="1080" fill="#0B1120"/><text x="72" y="78" fill="#20C5C7" font-family="Segoe UI, sans-serif" font-size="18" letter-spacing="3">SHAGHAD / THREE DIRECTIONS</text><text x="72" y="140" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="46" >Persian roots. Digital form.</text><text x="72" y="183" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="22" >Original vector studies • The three dots remain the cultural signature.</text><rect x="72" y="230" width="492" height="644" rx="24" fill="#1E293B" stroke="#20C5C7" stroke-width="2"/><g transform="translate(144,260) scale(.68)"><g fill="none" stroke="#20C5C7" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M104 282 V310 Q104 368 162 368 H180 Q232 368 232 310 V232 M232 292 Q232 320 274 320 Q316 320 316 292 V232 M316 292 Q316 320 358 320 Q400 320 400 292 V232"/></g><g fill="#20C5C7"><circle cx="276" cy="164" r="22"/><circle cx="316" cy="112" r="22"/><circle cx="356" cy="164" r="22"/></g></g><text x="100" y="668" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="27" >A — Persian Minimal</text><text x="100" y="710" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="18" >Open connected stroke · selected</text><text x="100" y="766" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="2">ACTUAL PIXEL SIZES</text><image x="100" y="792" width="16" height="16" href="data:image/png;base64,"/><text x="100" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >16</text><image x="192" y="792" width="24" height="24" href="data:image/png;base64,"/><text x="192" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >24</text><image x="284" y="792" width="32" height="32" href="data:image/png;base64,"/><text x="284" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >32</text><image x="376" y="792" width="48" height="48" href="data:image/png;base64,"/><text x="376" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >48</text><rect x="594" y="230" width="492" height="644" rx="24" fill="#1E293B" stroke="#45566C" stroke-width="1"/><g transform="translate(666,260) scale(.68)"><g fill="none" stroke="#20C5C7" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"><path d="M104 312 L168 376 H232 L288 320 H392 V224 M200 224 V320 H392 M296 224 V320"/><path d="M200 144 H296 L392 144"/></g><g fill="#20C5C7"><circle cx="200" cy="144" r="24"/><circle cx="296" cy="144" r="24"/><circle cx="392" cy="144" r="24"/></g></g><text x="622" y="668" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="27" >B — Network Geometry</text><text x="622" y="710" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="18" >Connected nodes · more detail</text><text x="622" y="766" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="2">ACTUAL PIXEL SIZES</text><image x="622" y="792" width="16" height="16" href="data:image/png;base64,"/><text x="622" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >16</text><image x="714" y="792" width="24" height="24" href="data:image/png;base64,"/><text x="714" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >24</text><image x="806" y="792" width="32" height="32" href="data:image/png;base64,"/><text x="806" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >32</text><image x="898" y="792" width="48" height="48" href="data:image/png;base64,"/><text x="898" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >48</text><rect x="1116" y="230" width="492" height="644" rx="24" fill="#1E293B" stroke="#45566C" stroke-width="1"/><g transform="translate(1188,260) scale(.68)"><path d="M388 184 H180 L116 248 L336 312 L272 376 H116" fill="none" stroke="#20C5C7" stroke-width="52" stroke-linecap="square" stroke-linejoin="bevel"/><g fill="#20C5C7"><rect x="132" y="96" width="36" height="36" rx="5"/><rect x="196" y="96" width="36" height="36" rx="5"/><rect x="260" y="96" width="36" height="36" rx="5"/></g></g><text x="1144" y="668" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="27" >C — Premium Monogram</text><text x="1144" y="710" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="18" >Angular S rhythm · less Persian recognition</text><text x="1144" y="766" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="2">ACTUAL PIXEL SIZES</text><image x="1144" y="792" width="16" height="16" href="data:image/png;base64,"/><text x="1144" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >16</text><image x="1236" y="792" width="24" height="24" href="data:image/png;base64,"/><text x="1236" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >24</text><image x="1328" y="792" width="32" height="32" href="data:image/png;base64,"/><text x="1328" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >32</text><image x="1420" y="792" width="48" height="48" href="data:image/png;base64,"/><text x="1420" y="854" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13" >48</text><text x="72" y="950" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="27" >A wins on letter recognition, negative space and tray-size clarity.</text><text x="72" y="995" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="20" >B is most explicitly networked. C is compact but its angular construction weakens the sheen reference.</text></svg>
